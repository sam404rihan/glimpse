name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    # Compiles the app and runs the JVM tests (face decoding, alignment, grouping, scanner rules).
    # The face models are not in the repository, so no APK is built here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew compileReleaseKotlin testDebugUnitTest --stacktrace
